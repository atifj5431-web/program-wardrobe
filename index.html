<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#8b5cf6"><meta name="description" content="Keep all your programs organized in one place."><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><title>Program Wardrobe V4.0</title>
<style>
:root{--a:#8b5cf6;--bg:#09090d;--c:#15151d;--c2:#20202b;--b:#30303c;--t:#fff;--m:#9b9baa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}header{position:sticky;top:0;background:#09090dee;border-bottom:1px solid var(--b);padding:15px;z-index:5}.head{max-width:950px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:bold}.ver{color:var(--a);font-size:12px;margin-top:4px}main{max-width:950px;margin:auto;padding:18px 14px 90px}.hero{padding:22px 3px}.hero h1{margin:0 0 8px;font-size:27px}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--c);border:1px solid var(--b);border-radius:15px;text-align:center;padding:14px 5px}.stat b{display:block;color:var(--a);font-size:22px}.stat span{font-size:10px;color:var(--m)}input,textarea,select{width:100%;padding:12px;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--a)}.search{margin:17px 0 10px}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.chip{flex:none;border:1px solid var(--b);background:var(--c);color:var(--m);padding:9px 13px;border-radius:30px}.chip.active{background:var(--a);color:white}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.section h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}.program{background:var(--c);border:1px solid var(--b);border-radius:17px;padding:15px;min-width:0}.top{display:flex;justify-content:space-between;gap:8px}.program h3{margin:0;overflow-wrap:anywhere}.star{background:none;color:#facc15;font-size:23px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;padding:5px 8px;background:var(--c2);border:1px solid var(--b);border-radius:7px;color:var(--m)}pre.snippet{height:75px;overflow:hidden;white-space:pre;background:#0b0b10;color:#bbb;padding:10px;border-radius:10px;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{padding:10px;border-radius:10px;background:var(--c2);color:white;border:1px solid var(--b)}.primary{background:var(--a);border-color:var(--a)}.danger{color:#ff8080}.empty{text-align:center;padding:40px 10px;color:var(--m)}.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:19px;background:var(--a);color:white;font-size:30px;z-index:6;box-shadow:0 8px 25px #0008}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;overflow:auto;padding:14px;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:var(--c);border:1px solid var(--b);border-radius:20px;padding:18px}.box h2{margin:0 0 16px}.close{float:right;background:var(--c2);color:white;border-radius:9px;padding:8px 12px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:6px}textarea{min-height:260px;font-family:monospace;resize:vertical}.full{width:100%;margin-top:8px;padding:12px;border-radius:11px;background:var(--c2);color:white;border:1px solid var(--b)}.full.primary{background:var(--a)}.code{white-space:pre;overflow:auto;max-height:55vh;background:#08080b;padding:12px;border-radius:10px;font:12px monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.folderrow{display:flex;justify-content:space-between;align-items:center;background:var(--c2);padding:12px;border-radius:10px;margin:7px 0}.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme{padding:16px 5px;border-radius:12px;color:white}.recent{padding:12px;border:1px solid var(--b);background:var(--c);border-radius:11px;margin-bottom:7px}.recent small{display:block;color:var(--m);margin-top:4px}iframe{width:100%;height:60vh;background:white;border:0;border-radius:10px}@media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style></head><body>
<header><div class="head"><div><div class="logo">👨‍💻 Program Wardrobe</div><div class="ver">V4.0 • Your Code Collection</div></div><div style="display:flex;gap:7px;align-items:center"><button class="btn" id="installBtn" onclick="installApp()" style="display:none">⬇️ Install</button><button class="btn" onclick="modal('settings')">⚙️</button></div></div></header>
<main><div class="hero"><h1>Your Programs. Your Wardrobe. 🔥</h1><div class="muted">Store, organize, search and run your programs.</div></div>
<div class="stats"><div class="stat"><b id="count">0</b><span>PROGRAMS</span></div><div class="stat"><b id="favCount">0</b><span>FAVORITES</span></div><div class="stat"><b id="folderCount">0</b><span>FOLDERS</span></div><div class="stat"><b id="tagCount">0</b><span>TAGS</span></div></div>
<div class="search"><input id="search" placeholder="🔍 Search name, code, tag..." oninput="render()"></div><div class="filters" id="filters"></div>
<div class="section"><h2>📂 My Programs</h2><span class="muted" id="shown"></span></div><div class="grid" id="grid"></div>
<div class="section"><h2>🕘 Recently Opened</h2></div><div id="recent"></div></main><button class="fab" onclick="edit()">+</button>

<div class="modal" id="editor"><div class="box"><button class="close" onclick="hide('editor')">✕</button><h2 id="editorHeading">➕ New Program</h2>
<div class="field"><label>Program name</label><input id="name" placeholder="My Awesome Program"></div><div class="row"><div class="field"><label>Language</label><select id="lang"><option>HTML</option><option>CSS</option><option>JavaScript</option><option>Python</option><option>C++</option><option>Java</option><option>Other</option></select></div><div class="field"><label>Folder</label><select id="folder"></select></div></div>
<div class="field"><label>Tags (comma-separated)</label><input id="tags" placeholder="game, experiment"></div><div class="field"><label>Code</label><textarea id="code" placeholder="Paste or write your code..."></textarea></div><button class="full primary" onclick="saveProgram()">💾 Save Program</button></div></div>
<div class="modal" id="viewer"><div class="box"><button class="close" onclick="hide('viewer')">✕</button><h2 id="viewName"></h2><div id="viewTags" class="tags"></div><pre id="viewCode" class="code"></pre><button id="runBtn" class="full primary" onclick="runHTML()">▶ Run HTML</button><button class="full" onclick="copyCurrent()">📋 Copy Code</button><button class="full" onclick="edit(currentId)">✏️ Edit</button></div></div>
<div class="modal" id="runner"><div class="box"><button class="close" onclick="hide('runner')">✕</button><h2>▶ HTML Preview</h2><iframe id="frame" sandbox="allow-scripts"></iframe></div></div>
<div class="modal" id="settings"><div class="box"><button class="close" onclick="hide('settings')">✕</button><h2>⚙️ Settings</h2><button class="full" onclick="modal('themes');hide('settings')">🎨 Change Theme</button><button class="full" onclick="folderManager();hide('settings')">📁 Manage Folders</button><button class="full" onclick="backup()">💾 Export Backup</button><button class="full" onclick="document.getElementById('file').click()">📥 Restore Backup</button><input hidden type="file" id="file" accept=".json" onchange="restore(event)"><button class="full" onclick="share()">📤 Share Collection</button><button class="full" onclick="stats()">📊 Statistics</button><button class="full danger" onclick="reset()">🗑 Delete All Programs</button></div></div>
<div class="modal" id="themes"><div class="box"><button class="close" onclick="hide('themes')">✕</button><h2>🎨 Choose Theme</h2><div class="themes"><button class="theme" style="background:#8b5cf6" onclick="setTheme('#8b5cf6')">Purple</button><button class="theme" style="background:#3b82f6" onclick="setTheme('#3b82f6')">Blue</button><button class="theme" style="background:#22c55e" onclick="setTheme('#22c55e')">Green</button><button class="theme" style="background:#f97316" onclick="setTheme('#f97316')">Orange</button><button class="theme" style="background:#ec4899" onclick="setTheme('#ec4899')">Pink</button><button class="theme" style="background:#06b6d4" onclick="setTheme('#06b6d4')">Cyan</button></div></div></div>
<div class="modal" id="folders"><div class="box"><button class="close" onclick="hide('folders')">✕</button><h2>📁 Manage Folders</h2><div class="row"><input id="newFolder" placeholder="Folder name"><button class="btn primary" onclick="addFolder()">Add</button></div><div id="folderList"></div></div></div>
<script>
const KEY='programWardrobeV4',FK='wardrobeFoldersV4',TK='wardrobeThemeV4';let programs=[],folders=['General','Websites','Games','Experiments'],currentId=null,current=null,filter='All';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(programs));localStorage.setItem(FK,JSON.stringify(folders))}
function init(){try{programs=JSON.parse(localStorage.getItem(KEY))||[]}catch{}try{folders=JSON.parse(localStorage.getItem(FK))||folders}catch{}if(!programs.length){for(const oldKey of ['programWardrobeV3','programWardrobeV2','programWardrobe']){try{const old=JSON.parse(localStorage.getItem(oldKey));if(Array.isArray(old)&&old.length){programs=old.map(p=>({...p,id:p.id||Date.now()+Math.random(),tags:Array.isArray(p.tags)?p.tags:[],folder:p.folder||'General',favorite:!!p.favorite,lastOpened:p.lastOpened||0}));break}}catch{}}}const th=localStorage.getItem(TK);if(th)setTheme(th,false);save();render()}
function modal(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}
function render(){let q=$('search').value.toLowerCase();let list=programs.filter(p=>(!q||[p.name,p.category,p.code,p.folder,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))&&(filter==='All'||(filter==='Favorites'?p.favorite:p.category===filter||p.folder===filter||(p.tags||[]).includes(filter))));$('shown').textContent=list.length+' shown';let filters=['All','Favorites',...programs.map(p=>p.category),...folders,...programs.flatMap(p=>p.tags||[])];$('filters').innerHTML=[...new Set(filters)].map(f=>`<button class="chip ${filter===f?'active':''}" onclick="setFilter(${JSON.stringify(f)})">${esc(f)}</button>`).join('');$('grid').innerHTML=list.length?list.map(p=>`<article class="program"><div class="top"><div><h3>${esc(p.name)}</h3><div class="tags"><span class="tag">${esc(p.category)}</span><span class="tag">📁 ${esc(p.folder||'General')}</span></div></div><button class="star" onclick="favorite(${p.id})">${p.favorite?'★':'☆'}</button></div><div class="tags">${(p.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><pre class="snippet">${esc(p.code)}</pre><div class="actions"><button class="btn primary" onclick="view(${p.id})">👁 Open</button><button class="btn" onclick="copy(${p.id})">📋 Copy</button><button class="btn" onclick="edit(${p.id})">✏️ Edit</button><button class="btn danger" onclick="del(${p.id})">🗑 Delete</button></div></article>`).join(''):'<div class="empty">📭<h3>No programs found</h3><p>Add your first program with the + button.</p></div>';$('count').textContent=programs.length;$('favCount').textContent=programs.filter(p=>p.favorite).length;$('folderCount').textContent=new Set(programs.map(p=>p.folder||'General')).size;$('tagCount').textContent=new Set(programs.flatMap(p=>p.tags||[])).size;let recent=programs.filter(p=>p.lastOpened).sort((a,b)=>b.lastOpened-a.lastOpened).slice(0,5);$('recent').innerHTML=recent.length?recent.map(p=>`<div class="recent" onclick="view(${p.id})"><b>${esc(p.name)}</b><small>${esc(p.category)} • ${esc(p.folder||'General')}</small></div>`).join(''):'<div class="empty">Nothing opened yet.</div>'}
function setFilter(f){filter=f;render()}
function edit(id=null){currentId=id;$('editorHeading').textContent=id?'✏️ Edit Program':'➕ New Program';$('folder').innerHTML=folders.map(f=>`<option>${esc(f)}</option>`).join('');if(id){let p=programs.find(x=>x.id===id);$('name').value=p.name;$('lang').value=p.category;$('folder').value=p.folder||'General';$('tags').value=(p.tags||[]).join(', ');$('code').value=p.code}else{$('name').value='';$('lang').value='HTML';$('folder').value='General';$('tags').value='';$('code').value=''}hide('viewer');modal('editor')}
function saveProgram(){let name=$('name').value.trim();if(!name){alert('Enter a program name.');return}let data={name,category:$('lang').value,folder:$('folder').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),code:$('code').value,updated:Date.now()};if(currentId){Object.assign(programs.find(p=>p.id===currentId),data)}else programs.unshift({...data,id:Date.now(),favorite:false,created:Date.now(),lastOpened:0});save();hide('editor');render()}
function view(id){currentId=id;current=programs.find(p=>p.id===id);current.lastOpened=Date.now();$('viewName').textContent=current.name;$('viewTags').innerHTML=[current.category,current.folder||'General',...(current.tags||[]).map(t=>'#'+t)].map(x=>`<span class="tag">${esc(x)}</span>`).join('');$('viewCode').textContent=current.code;$('runBtn').style.display=current.category==='HTML'?'block':'none';modal('viewer');save();render()}
function runHTML(){if(current){$('frame').srcdoc=current.code;modal('runner')}}
function favorite(id){let p=programs.find(p=>p.id===id);p.favorite=!p.favorite;save();render()}
function del(id){let p=programs.find(p=>p.id===id);if(confirm('Delete "'+p.name+'"?')){programs=programs.filter(x=>x.id!==id);save();render()}}
async function copy(id){let p=programs.find(p=>p.id===id);await copyText(p.code)}
async function copyCurrent(){await copyText(current?.code||'')}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('✅ Copied!')}catch{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('Copied!')}}
function setTheme(c,persist=true){document.documentElement.style.setProperty('--a',c);if(persist)localStorage.setItem(TK,c);hide('themes')}
function folderManager(){renderFolders();modal('folders')}
function renderFolders(){$('folderList').innerHTML=folders.map(f=>`<div class="folderrow"><span>📁 ${esc(f)}</span>${['General','Websites','Games','Experiments'].includes(f)?'':`<button class="btn danger" onclick="removeFolder(${JSON.stringify(f)})">Delete</button>`}</div>`).join('')}
function addFolder(){let n=$('newFolder').value.trim();if(!n)return;if(folders.includes(n)){alert('Folder already exists.');return}folders.push(n);$('newFolder').value='';save();renderFolders();render()}
function removeFolder(n){if(!confirm('Delete folder '+n+'?'))return;folders=folders.filter(f=>f!==n);programs.forEach(p=>{if(p.folder===n)p.folder='General'});save();renderFolders();render()}
function backup(){let blob=new Blob([JSON.stringify({version:'4.0',programs,folders},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='program-wardrobe-V4-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);programs=Array.isArray(d)?d:(d.programs||[]);if(d.folders)folders=d.folders;save();render();alert('Backup restored!')}catch{alert('Invalid backup file.')}e.target.value=''};r.readAsText(f)}
async function share(){let text=programs.map(p=>`## ${p.name} (${p.category})\n${p.code}`).join('\n\n---\n\n');try{if(navigator.share)await navigator.share({title:'Program Wardrobe',text});else await copyText(text)}catch{}}
function stats(){let langs={};programs.forEach(p=>langs[p.category]=(langs[p.category]||0)+1);alert(`PROGRAM WARDROBE STATS\nPrograms: ${programs.length}\nFavorites: ${programs.filter(p=>p.favorite).length}\nFolders: ${folders.length}\nTags: ${new Set(programs.flatMap(p=>p.tags||[])).size}\n\n`+Object.entries(langs).map(([k,v])=>`${k}: ${v}`).join('\n'))}
function reset(){if(confirm('Delete all programs? Export a backup first if needed.')){programs=[];save();render()}}
init();
</script>
<script>
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  const button = document.getElementById('installBtn');
  if (button) button.style.display = 'inline-block';
});
async function installApp() {
  if (!deferredInstallPrompt) {
    alert('To install: open this page in Chrome, tap ⋮, then choose “Add to Home screen” or “Install app”.');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body></html>
